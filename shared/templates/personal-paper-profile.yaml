profile_version: 2.1
name: ash-rise-chinese-modeling-paper
scope: repository_global_paper_formatting_default
physical_word_templates:
  default_reference: shared/templates/2026-cumcm-paper-template.docx
  location_scope: repository_global
  official_or_user_template_overrides_default: true
priority:
  - current_official_rules
  - user_provided_current_template
  - user_approved_reference_paper
  - this_profile

page:
  size: A4
  width_cm: 21.0
  height_cm: 29.7
  margins_cm:
    top: 2.5
    bottom: 2.5
    left: 2.5
    right: 2.5
  document_grid_line_pitch_twips: 360

typography:
  latin_font: Times New Roman
  title:
    east_asia_font: 宋体
    size_pt: 15
    bold: true
    alignment: center
    line_spacing_multiple: 1.0
    space_after_pt: 3
    prefer_single_line: true
  heading_level_1:
    numbering: chinese_comma
    example: 一、问题分析
    east_asia_font: 黑体
    size_pt: 14
    bold: true
    alignment: center
    line_spacing_multiple: 1.0
    space_before_pt: 2.5
    space_after_pt: 2.5
  heading_level_2_and_3:
    numbering: decimal
    example: 2.1 任务一分析
    east_asia_font: 宋体
    size_pt: 12
    bold: true
    alignment: left
    line_spacing_multiple: 1.0
    space_before_pt: 2.5
    space_after_pt: 2.5
  body:
    east_asia_font: 宋体
    size_pt: 12
    alignment: justify
    first_line_indent_pt: 24
    line_spacing_multiple: 1.5
    space_before_pt: 0
    space_after_pt: 0
  caption:
    east_asia_font: 宋体
    size_pt: 10.5
    alignment: center
    line_spacing_multiple: 1.5
    space_before_pt: 0
    space_after_pt: 0
  reference_and_short_appendix:
    east_asia_font: 宋体
    size_pt: 10.5
    line_spacing_multiple: 1.25
    hanging_indent_pt: 21
  table_text:
    east_asia_font: 宋体
    size_pt: 10
    line_spacing_multiple: 1.15
    vertical_alignment: center

equations:
  format: native_omml
  display_alignment: center
  citation_markers_superscript: true
  compound_scripts_single_run: true
  avoid_numeric_only_display: true
  markdown_safe_star: '^{\ast}'
  standard_modulo: '%'
  standard_exponential: '\exp(·) or e^{·}'

tables:
  style: three_line
  manual_word_baseline:
    precedence: higher_than_generic_table_rules
    baseline_requires_structural_and_render_approval: true
    inherit_when_content_unchanged: complete_table_ooxml
    final_release_lock_mode: complete_table_ooxml_only
    layout_only_mode: transitional_draft_only
    exact_table_replacement_must_be_last_table_operation: true
    preserved_properties:
      - column_widths
      - paragraph_alignment
      - font_size
      - wrapping
      - borders
      - cell_margins
      - row_properties
      - table_style
    fail_on_content_drift: true
    hash_is_identity_check_not_layout_proof: true
    require_save_close_reload_before_comparison: true
    require_complete_table_xml_regression: true
    require_semantic_alignment_assertions: true
    require_render_checks:
      - one_character_lines
      - mixed_alignment
      - unexpected_wrapping
    reject_baseline_with_known_visual_defects: true
    patch_scope_for_manual_corrections: affected_ooxml_parts_only
    wrapped_text_inherits_paragraph_alignment: true
    narrative_columns_default_alignment: left
  top_border_ooxml_size: 10
  header_bottom_border_ooxml_size: 4
  bottom_border_ooxml_size: 10
  inside_horizontal: nil
  inside_vertical: nil
  left_border: nil
  right_border: nil
  remove_row_tblPrEx_borders: true
  prefer_single_line_short_fields: true
  layout_priority:
    - semantic_column_widths
    - compact_cell_margins
    - concise_labels
    - font_reduction_last
  algorithm_table:
    header_alignment: center
    body_column_1_alignment: left
    body_column_2_alignment: left

figures:
  vector_format: svg
  raster_format: png
  raster_dpi_min: 300
  color_palette: colorblind_safe
  redundant_encoding: true
  grayscale_preview: true
  in_paper_label_size_pt: 7-9
  minimum_label_size_pt: 6
  require_figure_contract: true
  avoid_redundant_table_and_figure: true
  no_jpeg_for_quantitative_charts: true

markdown:
  source_target:
    dialect: pandoc_markdown
    role: authoritative_content_and_docx_source
    editable: true
    inline_math_delimiter: '$...$'
    display_math_delimiter: '$$...$$'
    citation_superscript_pattern: '^\\[n\\]^'
    image_width_pattern: '![](path){width=N%}'
  publish_derived_github_preview: false
