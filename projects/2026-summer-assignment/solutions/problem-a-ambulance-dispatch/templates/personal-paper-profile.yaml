profile_version: 2.0
name: ash-rise-chinese-modeling-paper
priority:
  - current_official_rules
  - user_provided_current_template
  - user_approved_reference_paper
  - this_profile

page:
  size: A4
  width_cm: 21.0
  height_cm: 29.7
  margins_cm:
    top: 2.5
    bottom: 2.5
    left: 2.5
    right: 2.5
  document_grid_line_pitch_twips: 360

typography:
  latin_font: Times New Roman
  title:
    east_asia_font: 宋体
    size_pt: 15
    bold: true
    alignment: center
    line_spacing_multiple: 1.0
    space_after_pt: 3
    prefer_single_line: true
  heading_level_1:
    numbering: chinese_comma
    example: 一、问题分析
    east_asia_font: 黑体
    size_pt: 14
    bold: true
    alignment: center
    line_spacing_multiple: 1.0
    space_before_pt: 2.5
    space_after_pt: 2.5
  heading_level_2_and_3:
    numbering: decimal
    example: 2.1 任务一分析
    east_asia_font: 宋体
    size_pt: 12
    bold: true
    alignment: left
    line_spacing_multiple: 1.0
    space_before_pt: 2.5
    space_after_pt: 2.5
  body:
    east_asia_font: 宋体
    size_pt: 12
    alignment: justify
    first_line_indent_pt: 24
    line_spacing_multiple: 1.5
    space_before_pt: 0
    space_after_pt: 0
  caption:
    east_asia_font: 宋体
    size_pt: 10.5
    alignment: center
    line_spacing_multiple: 1.5
    space_before_pt: 0
    space_after_pt: 0
  reference_and_short_appendix:
    east_asia_font: 宋体
    size_pt: 10.5
    line_spacing_multiple: 1.25
    hanging_indent_pt: 21
  table_text:
    east_asia_font: 宋体
    size_pt: 10
    line_spacing_multiple: 1.15
    vertical_alignment: center

equations:
  format: native_omml
  display_alignment: center
  citation_markers_superscript: true
  compound_scripts_single_run: true
  avoid_numeric_only_display: true
  markdown_safe_star: '^{\ast}'
  standard_modulo: '%'
  standard_exponential: '\exp(·) or e^{·}'

tables:
  style: three_line
  manual_word_baseline:
    precedence: higher_than_generic_table_rules
    baseline_requires_structural_and_render_approval: true
    inherit_when_content_unchanged: complete_table_ooxml
    final_release_lock_mode: complete_table_ooxml_only
    layout_only_mode: transitional_draft_only
    exact_table_replacement_must_be_last_table_operation: true
    preserved_properties:
      - column_widths
      - paragraph_alignment
      - font_size
      - wrapping
      - borders
      - cell_margins
      - row_properties
      - table_style
    fail_on_content_drift: true
    record_absolute_path_and_sha256: true
    hash_is_identity_check_not_layout_proof: true
    require_save_close_reload_before_comparison: true
    require_complete_table_xml_regression: true
    require_semantic_alignment_assertions: true
    require_render_checks:
      - one_character_lines
      - mixed_alignment
      - unexpected_wrapping
    reject_baseline_with_known_visual_defects: true
    patch_scope_for_manual_corrections: affected_ooxml_parts_only
    wrapped_text_inherits_paragraph_alignment: true
    narrative_columns_default_alignment: left
  top_border_ooxml_size: 10
  header_bottom_border_ooxml_size: 4
  bottom_border_ooxml_size: 10
  inside_horizontal: nil
  inside_vertical: nil
  left_border: nil
  right_border: nil
  remove_row_tblPrEx_borders: true
  prefer_single_line_short_fields: true
  layout_priority:
    - semantic_column_widths
    - compact_cell_margins
    - concise_labels
    - font_reduction_last
  algorithm_table:
    header_alignment: center
    body_column_1_alignment: left
    body_column_2_alignment: left

figures:
  vector_format: svg
  raster_format: png
  raster_dpi_min: 300
  color_palette: colorblind_safe
  redundant_encoding: true
  grayscale_preview: true
  in_paper_label_size_pt: 7-9
  minimum_label_size_pt: 6
  require_figure_contract: true
  avoid_redundant_table_and_figure: true
  no_jpeg_for_quantitative_charts: true

markdown:
  source_target:
    dialect: pandoc_markdown
    role: authoritative_content_and_docx_source
    editable: true
    inline_math_delimiter: '$...$'
    display_math_delimiter: '$$...$$'
    citation_superscript_pattern: '^\\[n\\]^'
    image_width_pattern: '![](path){width=N%}'
  publish_derived_github_preview: false

workflow:
  default_delivery: docx
  latex_only_when_explicitly_requested: true
  markdown_review_required_before_docx: true
  markdown_review_artifacts:
    - pandoc_markdown_source
    - content_change_report
  docx_generation_requires_explicit_user_approval: true
  docx_stage_content_changes_forbidden: true
  docx_content_issue_return_path: markdown_review
  decision_log_required: true
  model_gate: M1
  minimum_run_gate: P1
  minimum_implementation_gate: P1
  figure_and_implementation_gate: P2
  evidence_outline_gate: W1
  final_review_gate: W2
  final_review_only_after_user_changes_closed: true
  parameter_study_timebox_minutes: 20
  hash_policy: final_freeze_only
  pdf_role: temporary_visual_qa_only
  audit:
    evidence_labels:
      - verified_fact
      - reasoned_inference
      - unknown
    numeric_conflict_resolution:
      order:
        - raw_replication_or_observation_data
        - explicit_statistical_formula_and_parameters
        - independent_recalculation
        - comparison_with_tables_figures_and_manuscript
      manuscript_agreement_is_not_proof: true
      unresolved_without_raw_data_or_formula: unknown
    automated_findings_require_manual_confirmation: true
    automated_confirmation_sources:
      - authoritative_markdown
      - raw_results
      - docx_ooxml
      - rendered_pages
    docx_review:
      require_structure_and_render: true
      report_section_membership_and_visual_position_separately: true
      inspect:
        - body_paragraphs
        - tables
        - omml_equations
        - figures_and_captions
        - pagination
        - references
        - appendices
      plain_text_extraction_is_insufficient: true
  reusable_rule_promotion:
    enabled: true
    user_authorized: true
    requirements:
      - verified_in_real_artifact_or_official_renderer
      - reusable_across_projects
      - no_conflict_with_current_official_rules
      - no_conflict_with_current_user_decision
    record_source_and_date: true
    update_both_human_and_machine_profiles_when_applicable: true
    never_promote_one_off_workarounds: true
    registry:
      - id: markdown_dual_target
        added_on: '2026-08-13'
        source: v2.4_github_renderer_compatibility_audit
        status: retired_by_user_decision
        retired_on: '2026-08-13'
        evidence:
          - github_markdown_api
          - reproducible_preview_tests
        scope: pandoc_docx_source_and_github_online_preview
      - id: separate_paper_and_tooling_changelogs
        added_on: '2026-08-13'
        source: v2.4_release_timestamp_boundary_audit
        evidence:
          - formal_docx_unchanged
          - git_commit_timeline
        scope: release_notes_and_workflow_template_changelog
      - id: exact_manual_word_table_lock
        added_on: '2026-08-13'
        source: v2.5_wps_table_lock_regression
        evidence:
          - user_corrected_v2.5_docx
          - complete_table_ooxml_save_reload_test
          - affected_page_render_review
        scope: manual_word_table_baselines_and_docx_regeneration
      - id: source_file_purpose_header
        added_on: '2026-08-15'
        source: problem_a_src_inventory_review
        evidence:
          - purpose_headers_added_to_tracked_source_files
          - python_compileall_passed
          - independent_p2_source_header_review_passed
        scope: modeling_project_source_files
      - id: fixed_paper_entrypoint
        added_on: '2026-08-16'
        source: problem_a_tag_history_migration
        evidence:
          - fixed_main_artifacts
          - existing_release_tags
          - conversion_manifest_verification
        scope: multi_project_paper_versioning
      - id: raw_evidence_numeric_audit
        added_on: '2026-08-16'
        source: problem_a_strategy_b_confidence_interval_recalculation
        evidence:
          - replication_level_results
          - explicit_t_interval_formula
          - independent_recalculation
        scope: numeric_and_statistical_conflict_resolution
      - id: docx_structure_visual_joint_review
        added_on: '2026-08-16'
        source: problem_a_docx_section_location_correction
        evidence:
          - docx_structure_inspection
          - rendered_page_and_screenshot_confirmation
        scope: docx_cross_reference_and_layout_review
      - id: local_git_state_classification
        added_on: '2026-08-16'
        source: problem_a_github_desktop_and_stash_cleanup
        evidence:
          - tracked_untracked_ignored_stash_classification
          - stash_content_value_review
          - precise_git_info_exclude_validation
        scope: mixed_worktree_and_local_only_material

implementation:
  source_file_purpose_header:
    required: true
    scope: src_source_files
    extensions:
      - .py
      - .m
    position: first_line
    language: concise_chinese
    comment_markers:
      python: '#'
      matlab: '%'
    describe:
      - file_purpose
      - pipeline_role
    forbid:
      - implementation_details
      - parameter_lists
      - change_history

appendix:
  full_source_code_policy: repository_or_separate_attachment
  include_in_paper:
    - core_pseudocode
    - key_function_descriptions
    - reproduction_entrypoint
    - necessary_supplementary_material
  exclude_from_paper:
    - full_multi_file_source_dump
    - test_suite_dump
    - engineering_logs
  page_limit_claim_requires_official_rule: true

git:
  status_classification_required:
    - tracked_modifications
    - untracked_files
    - ignored_files
    - stash
    - branch_ahead_behind
  large_untracked_count_is_not_corruption_evidence: true
  local_only_material:
    preferred_exclusion: .git/info/exclude
    use_exact_paths: true
    forbid_broad_shared_directory_exclusion: true
    backup_exclude_before_edit: timestamped
  stash_drop_requires:
    - content_already_in_branch_or_tag_or_formally_replaced
    - no_remaining_independent_value
    - no_needed_unique_work
    - restoration_would_not_reintroduce_obsolete_rules
  forbidden_cleanup_commands:
    - git clean -X -e
    - git reset --hard

release:
  current_paper_directory: paper
  current_artifacts:
    markdown: paper/paper.md
    docx: paper/paper.docx
    conversion_manifest: paper/paper.conversion.json
  retain_version_copies_on_main: false
  history_source: git_tag
  tag_pattern: <project-id>/vX.Y
  release_asset_pattern: <paper-name>-vX.Y.docx
  required_artifacts:
    - pandoc_markdown_source
    - docx
    - conversion_manifest
  bilingual_readme: true
  timestamp_format: YYYY-MM-DD HH:mm UTC+8
  paper_timestamp_changes_only_with_formal_paper_deliverable: true
  tooling_and_template_changelog_separate: true
  attach_latest_docx_to_release: true
  explicit_staging_only: true
  author_identity: user_github_identity
